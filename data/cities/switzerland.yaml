# Swiss cities with >40k inhabitants
# Research source: staedte-parameter-recherche.md
# Generated: npm run build:data
# Last updated: 2026-06-06
# New param: bau_ersatzneubau_effizienz (Sotomo ZH-Wohnraumstudie 2025)
# Entfernt 2026-11-15 (Fix-14): context.mietbelastungs_grenze. Die Werte 1/2 waren
# nicht gemessen (Sotomo 2025 deckt nur den Kanton Zürich ab) und flossen in keine Rechnung.
#
# bevoelkerungstrend: Wachstum der ständigen Wohnbevölkerung pro Jahr, 2019–2024,
# BFS STATPOP (STAT-TAB px-x-0102020000_201, Bestand am 31. Dezember).
# Bins (Setzung, 2026-11): unter −0.5 % → −2 | −0.5 bis −0.1 % → −1 |
# −0.1 bis +0.4 % → 0 | +0.4 bis +1.0 % → +1 | über +1.0 % → +2.
# Zum Vergleich: Schweiz rund +0.9 % pro Jahr.
#
# zuwanderungsdruck: internationaler Wanderungssaldo (Einwanderung inkl. Änderung
# des Bevölkerungstyps minus Auswanderung) in % des Bestands am 1. Januar,
# Durchschnitt 2019–2024, BFS (STAT-TAB px-x-0102020000_201).
# Bins (Setzung, 2026-11): unter −0.5 % → −2 | −0.5 bis 0 % → −1 |
# 0 bis +0.8 % → 0 | +0.8 bis +1.5 % → +1 | über +1.5 % → +2.
# Der Typwechsel (nichtständige → ständige Wohnbevölkerung) ist mitgezählt, weil
# diese Personen Wohnraum belegen; 2023 war er ein Sondereffekt. Ohne ihn lägen
# die Werte 0.3 bis 1.0 Prozentpunkte tiefer. Grenzfälle: Winterthur, Biel, Basel.
#
# anteil_altliegenschaft: Rohwert 0…1, keine Stufe. BGE 144 III 514 (CH-012).
# Quelle: BFS Gebäude- und Wohnungsstatistik (GWS), Bestand am 31.12.2025,
# Swiss Stats Explorer DF_GWS_REG5 (Nachfolger von STAT-TAB px-x-0902020200_102),
# Wohnungen nach Gemeinde, Gebäudekategorie und Bauperiode, abgefragt 2026-11-15.
# Schnitt: Bauperiode bis 1995 (Klasse 1991–1995 eingeschlossen). Stichtag − 30 =
# 1995; die GWS-Klassengrenze fällt hier genau auf die 30-Jahre-Grenze.
# Abgrenzung: Wohnungen in Wohngebäuden OHNE Einfamilienhäuser (Mehrfamilienhäuser,
# Wohngebäude mit Nebennutzung, Gebäude mit teilweiser Wohnnutzung).
# Abweichung von der Messvorschrift: Die GWS kennt keine Bewohnerart. «Nur
# Mietwohnungen» pro Gemeinde ist nicht publiziert. Enthalten sind deshalb auch
# Stockwerkeigentum, Genossenschaftswohnungen, leer stehende und zeitweise bewohnte
# Wohnungen. Richtung: eher Unterschätzung. Schweizweit sind bewohnte Mietwohnungen
# älter als alle bewohnten Wohnungen (BFS SE 2024, T 09.03.02.01.05: gebaut bis 1990
# 70.0 % gegen 65.4 %), Stockwerkeigentum ist deutlich jünger (39.9 %). In den
# Städten mit tiefem Eigentumsanteil dürfte der Abstand kleiner sein; pro Stadt
# nicht gemessen. EFH weglassen senkt den Wert in den Städten leicht (EFH dort älter).
# Nicht berücksichtigt: Renovationen (Bauperiode = Erstellung) und jüngere
# Handänderungen (nach dem Urteil nicht abziehen, CH-012).
# Wirkt nur über WIRKSAMKEIT_OQU (heute 0): ändert kein Rechenergebnis.
#
# params.gemeinnuetzig_ausgleich (neu 2026-11-16): Ausgleich für den gemeinnützigen
# Pflichtanteil (0 kein, 1 teilweise, 2 voll). NICHT ERHOBEN: alle Städte stehen auf 0.
# Das ist eine Setzung, kein Befund. Zu prüfen wäre je Stadt das kantonale Recht
# (z. B. Pflichtanteile, die nur bei Mehrausnützung greifen). Weil Parameter als Diff
# wirken, ändert der Wert 0 kein bisheriges Ergebnis.
#
# mietabstand_neubezug: NUR ANZEIGE, fliesst in keine Rechnung (Entscheid 2026-11-15).
# faktor = Nettomiete bei Neubezug / Nettomiete bei 21 und mehr Jahren Mietdauer.
# Quelle: BFS Strukturerhebung 2024, Mieter- und Genossenschafterwohnungen.
# ebene: stadt  → T 09.03.03.67 (nur Zürich, Genf, Basel, Lausanne, Bern), Neubezug
#                 unter 2 Jahren (Neubau eingeschlossen), Mittel der Verhältnisse für
#                 2, 3 und 4 Zimmer.
# ebene: kanton → T 09.03.03.64, Neubezug einer mehr als zwei Jahre alten Wohnung
#                 (ohne Neubau), alle Zimmerzahlen zusammen. Für die übrigen Städte
#                 gibt es nur diese Ebene.
# Die beiden Ebenen sind NICHT vergleichbar (Neubau, Zimmerzahl, Stadt/Kanton).
# Durchschnitte: einzelne Wohnungen liegen weit darüber. Der Abstand enthält Lage,
# Zustand, Gebäudealter und den Genossenschaftsanteil; er ist nicht der Abstand zum
# zulässigen Ertrag (mietluecke bleibt leer, CH-012). Vertrauensintervalle bis ±0.1.

